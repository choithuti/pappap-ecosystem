[package]
name = "pappap-node"
version = "0.4.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
actix-web = "4.8"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
num_cpus = "1.16"
sys-info = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
serde_json = "1.0.145"
reqwest = "0.12.24"
scraper = "0.24.0"

[features]
high-neuron-mode = []
